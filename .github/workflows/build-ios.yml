name: Build iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mwave-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'
          bundler: '2.6.9'
      - name: Dependencies
        run: |
          test -d "$DEVELOPER_DIR"
          npm ci --include=dev
          bundle install --jobs 4 --retry 3
      - name: Cache browser for fixture acceptance
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-1.56.1-macos
      - name: Types, offline tests, web acceptance
        run: |
          npm run typecheck
          npm run check:dependencies
          npm test
          npm run check:native
          python3 -m unittest discover -s scripts -p 'test_*.py'
          npx playwright install chromium
          npm run test:web
          cd ../server
          npm ci --include=dev
          npm run typecheck
          npm test
      - name: Generate iOS
        run: npm run prebuild:ios
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-16.4-${{ hashFiles('app/package-lock.json', 'app/app.json', 'app/modules/**/*.podspec') }}
      - name: Install pods and verify native module
        run: |
          bundle exec pod install --project-directory=ios
          npm run check:native
      - name: Cache Xcode
        uses: actions/cache@v4
        with:
          path: |
            app/build/derived-device
            app/build/sim-derived
          key: xcode-16.4-${{ hashFiles('app/package-lock.json', 'app/app.json', 'app/modules/**/*') }}
      - name: Native simulator acceptance on synthetic audio
        run: |
          START=$(date +%s)
          bash scripts/simulator-screens.sh
          printf '{"simulatorBuildAndChecksSeconds":%s}\n' "$(( $(date +%s)-START ))" > build/simulator-times.json
      - name: Compile device Release and package IPA
        run: bash scripts/build-ios-unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mwave-2.0.0-ipa-${{ github.run_number }}
          path: |
            app/build/mwave-unsigned.ipa
            app/build/mwave-unsigned.ipa.sha256
            app/build/ipa-validation.json
            app/build/build-environment.txt
            app/build/build-times.json
            app/build/simulator-times.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload acceptance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwave-acceptance-${{ github.run_number }}
          path: |
            app/build/screens/native-qa.json
            app/build/screens/hls-requests.json
            app/build/screens/native-acceptance.png
            app/build/screens/xcodebuild-sim.log
            app/build/xcodebuild.log
            app/build/web-results.json
            app/build/web-*.png
            app/test-results/
            app/ios/Podfile.lock
          retention-days: 14
      - name: Summary
        run: |
          echo 'mwave 2.0.0: unsigned device IPA. Install with Sideloadly; re-sign every 7 days with a free Apple ID.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Physical iPhone lockscreen, background and headphone acceptance remains required.' >> "$GITHUB_STEP_SUMMARY"
