# Сборка неподписанного IPA mwave для iPhone (arm64). Основа: проверенная сборка Cabbit iOS Test
# (те же macos-15, Xcode 16.4, Node 22.14.0, Ruby 3.3.7, CocoaPods 1.16.2, expo prebuild + xcodebuild без подписи).
# Запуск только вручную (Actions -> Build iPhone IPA -> Run workflow), чтобы не тратить минуты macOS.
# Секреты репозитория: MWAVE_URL (адрес сервера) и MWAVE_KEY (ключ сервиса), в коде их нет.
name: Build iPhone IPA

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Снимки экранов в симуляторе iPhone (ещё около 10 минут)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mwave-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      # Подставляются в приложение при сборке JS (Metro), в репозиторий не попадают
      EXPO_PUBLIC_MWAVE_URL: ${{ secrets.MWAVE_URL }}
      EXPO_PUBLIC_MWAVE_KEY: ${{ secrets.MWAVE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          test -n "$EXPO_PUBLIC_MWAVE_URL" || { echo 'Нет секрета MWAVE_URL'; exit 1; }
          test -n "$EXPO_PUBLIC_MWAVE_KEY" || { echo 'Нет секрета MWAVE_KEY'; exit 1; }

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'
          bundler: '2.6.9'

      - name: Install dependencies
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          npm ci --include=dev
          bundle install --jobs 4 --retry 3
          bundle exec pod --version

      - name: Checks (TypeScript, Expo versions, tests)
        run: |
          npm run typecheck
          npm run check:dependencies
          node --import tsx --test test/*.test.ts
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate iOS project
        run: npm run prebuild:ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json', 'app/modules/**/*.podspec') }}

      - name: Install iOS pods
        run: bundle exec pod install --project-directory=ios

      - name: Compile device Release and package IPA
        run: bash scripts/build-ios-unsigned.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mwave-ipa-${{ github.run_number }}
          path: |
            app/build/mwave-unsigned.ipa
            app/build/mwave-unsigned.ipa.sha256
            app/build/ipa-validation.json
            app/build/build-environment.txt
          if-no-files-found: error
          retention-days: 30

      - name: Screenshots in iPhone simulator
        if: ${{ inputs.screenshots }}
        run: bash scripts/simulator-screens.sh

      - name: Upload screenshots
        if: ${{ always() && inputs.screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: mwave-screens-${{ github.run_number }}
          path: |
            app/build/screens/*.png
            app/build/screens/log.txt
            app/build/screens/xcodebuild-sim.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwave-build-logs-${{ github.run_number }}
          path: |
            app/build/xcodebuild.log
            app/build/build-environment.txt
            app/ios/Podfile.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        run: |
          echo '### mwave: IPA для iPhone собран' >> "$GITHUB_STEP_SUMMARY"
          echo 'Скачать: артефакт mwave-ipa (ZIP), внутри mwave-unsigned.ipa. Установить через Sideloadly с бесплатным Apple ID.' >> "$GITHUB_STEP_SUMMARY"
