# mwave: отдельный сайт nginx, существующие сайты и порт 443 (SNI-роутер VPN) не меняются.
# Порт 80: только проверка Let's Encrypt для mwave.swiftsuper.online (остальные имена его не касаются).
server {
    listen 80;
    server_name mwave.swiftsuper.online;
    location /.well-known/acme-challenge/ { root /var/www/mwave-acme; }
    location / { return 404; }
}
# Порт 8781: HTTPS для приложения, дальше на сервис 127.0.0.1:8780.
# Сертификат: /etc/letsencrypt/live/mwave.swiftsuper.online (продлевает certbot.timer).
server {
    listen 8781 ssl;
    server_name mwave.swiftsuper.online;
    ssl_certificate /etc/letsencrypt/live/mwave.swiftsuper.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mwave.swiftsuper.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/mwave.access.log;
    error_log /var/log/nginx/mwave.error.log;
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Звук идёт потоком: без буфера и с длинным ожиданием
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
